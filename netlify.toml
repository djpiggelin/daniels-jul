[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# The 3D village (jul3d/, built to /by/) is the front page
[[redirects]]
  from = "/"
  to = "/by/index.html"
  status = 200
  force = true

# Guest photos used to live in the repo – knytis claims saved before the move still point here
[[redirects]]
  from = "/Participants/*"
  to = "/media/photos/:splat"
  status = 301

# SPA fallback – keep /api/* for functions
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# so browsers read it as a web app manifest (home screen / fullscreen)
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

name: CI

on:
  pull_request:
    branches: [dev, test, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  # Changes flow feature → dev → test → main.
  branch-flow:
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$BASE" = "test" ] && [ "$HEAD" != "dev" ]; then
            echo "::error::PRs into test must come from dev (got $HEAD)."; exit 1
          fi
          if [ "$BASE" = "main" ] && [ "$HEAD" != "test" ]; then
            echo "::error::PRs into main must come from test (got $HEAD)."; exit 1
          fi
          echo "$HEAD → $BASE ok"
